<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANIMAL MOTION STUDY - Firefly</title>

    <link rel="stylesheet" href="./style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./script.js" defer></script>
  </head>

  <body>
    <div class="poster">
      <!-- 텍스트 : 제목 · 부제 -->
      <h1 class="title">ANIMAL<br />MOTION STUDY</h1>
      <p class="subtitle">An Exploration of Movement</p>

      <!-- 텍스트 : 오른쪽 위 추가 문구 -->
      <p class="extra">INTERACTIVE WEB EXPERIMENT / 2026</p>

      <!-- 텍스트 : 왼쪽 아래 설명 -->
      <p class="desc">
        Exploring the rhythm, direction, and behavior of natural movement
        through geometric forms.
      </p>

      <!-- 텍스트 : 오른쪽 아래 행사 정보 -->
      <div class="info">
        <p class="date">DEC 10, 2026</p>
        <p>10:00 AM – 06:00 PM</p>
        <p>DIGITAL ART EXHIBITION</p>
        <p class="organizer">Organized by MYONGJI UNIVERSITY</p>
      </div>

      <!-- 반딧불이 5개
           gather(모여듦 : 마우스) > float(떠다님 : 애니메이션) > firefly(깜빡임 : 애니메이션) -->
      <div class="firefly-gather g1">
        <div class="firefly-float f1"><div class="firefly s1"></div></div>
      </div>
      <div class="firefly-gather g2">
        <div class="firefly-float f2"><div class="firefly s2"></div></div>
      </div>
      <div class="firefly-gather g3">
        <div class="firefly-float f3"><div class="firefly s3"></div></div>
      </div>
      <div class="firefly-gather g4">
        <div class="firefly-float f4"><div class="firefly s4"></div></div>
      </div>
      <div class="firefly-gather g5">
        <div class="firefly-float f5"><div class="firefly s5"></div></div>
      </div>
    </div>
  </body>
</html>
